name: Release

# docs/ota-update-spec.md 6.1 / 13 steps 5-6. Manifest lives on the
# gh-pages branch (GitHub Pages source) at ota/manifest.json; each run
# updates only its own channel's entry, leaving the other alone.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check no Wi-Fi defaults are committed
        run: |
          if grep -qE '^CONFIG_DUSTER_WIFI_DEFAULT_(SSID|PSK)="[^"]' sdkconfig.defaults; then
            echo "::error::sdkconfig.defaults must not set a default Wi-Fi SSID or PSK (docs/ota-update-spec.md 3.2)"
            exit 1
          fi

      - name: Set FIRMWARE_VERSION and CHANNEL from the tag
        run: |
          echo "FIRMWARE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
          fi

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: '.'
          # auxbeam-light-controller (the one external git dependency,
          # main/components/aux_link/idf_component.yml) is public, so the
          # IDF Component Manager clones it anonymously -- no credentials
          # needed inside the build container.
          extra_docker_args: -e FIRMWARE_VERSION=${{ env.FIRMWARE_VERSION }}

      - name: Sign firmware
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          python3 -m pip install --quiet esptool
          umask 177
          printf '%s' "$OTA_SIGNING_KEY" > signing_key.pem
          espsecure.py sign_data --version 2 --keyfile signing_key.pem \
            -o firmware.bin build/duster-m5dial-controller.bin
          shred -u signing_key.pem

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          args=(release create "$TAG" firmware.bin --title "$TAG" --generate-notes)
          if [[ "${{ env.CHANNEL }}" == beta ]]; then
            args+=(--prerelease)
          else
            args+=(--latest)
          fi
          gh "${args[@]}"

      - name: Publish manifest entry (docs/ota-update-spec.md 6.2)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          SIZE=$(stat -c%s firmware.bin)
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/firmware.bin"

          rm -rf /tmp/pages
          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" /tmp/pages

          mkdir -p /tmp/pages/ota
          MANIFEST=/tmp/pages/ota/manifest.json
          [ -f "$MANIFEST" ] || echo '{"schema":1}' > "$MANIFEST"
          jq --arg ch "${{ env.CHANNEL }}" \
             --arg ver "${{ env.FIRMWARE_VERSION }}" \
             --arg url "$URL" \
             --argjson size "$SIZE" \
             '.schema = 1 | .[$ch] = {version: $ver, url: $url, size: $size}' \
             "$MANIFEST" > "$MANIFEST.tmp"
          mv "$MANIFEST.tmp" "$MANIFEST"

          cd /tmp/pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ota/manifest.json
          git commit -m "Update ${{ env.CHANNEL }} manifest entry to ${TAG}"
          git push origin gh-pages
